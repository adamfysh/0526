# check-cdm-freshness.yml
# Same freshness monitor as app/.github/workflows/check-cdm-freshness.yml,
# checking this repo's public/simulator_data.json copy instead. See that file
# for the full rationale (foundation audit, 2026-07-08).

name: Check CDM data freshness

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check simulator_data.json freshness
        env:
          MAX_AGE_DAYS: 21
        run: python3 .github/workflows/check_cdm_freshness.py
