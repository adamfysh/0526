# check-cdm-freshness.yml
# Same freshness monitor as app/.github/workflows/check-cdm-freshness.yml,
# checking this repo's public/ copies instead. See that file for the full
# rationale (foundation audit 2026-07-08; Fix-113/114/115, 2026-09-10).

name: Check CDM data freshness

on:
  schedule:
    - cron: '0 7 * * *'   # 07:00 UTC daily
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check data freshness (simulator_data.json, cape_tide_feed.json, cape_corridor_feed.json, NARROWS-SIGNALS.js)
        env:
          FRESHNESS_PATH_PREFIX: 'public/'
        run: python3 .github/workflows/check_cdm_freshness.py
