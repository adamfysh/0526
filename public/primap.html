<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Port Risk Index — Narrows</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:       #0A2540;
    --navy-mid:   #0d304f;
    --blue:       #1565A8;
    --blue-light: #2E86D4;
    --gold:       #F0B429;
    --gold-dark:  #dea020;
    --white:      #FFFFFF;
    --surface:    #F6F8FB;
    --border:     #E4EAF2;
    --text-sec:   #4A6078;
    --text-ter:   #8FA5BB;
    --font: 'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif;

    --c-moderate: #2E86D4;
    --c-elevated: #7FA8C9;
    --c-high:     #E8952A;
    --c-critical: #F0B429;
  }

  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  html, body { height: 100%; font-family: var(--font); }

  /* ── LAYOUT ── */
  .page { display: flex; flex-direction: column; height: 100vh; }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    border-bottom: 2px solid var(--gold);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-shrink: 0;
    z-index: 1000;
  }
  .header-left { display: flex; align-items: center; gap: 20px; }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--white);
    text-decoration: none;
  }
  .brand span { color: var(--gold); }
  .header-title {
    font-size: 12px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.06em;
    padding-left: 20px;
    border-left: 1px solid rgba(255,255,255,0.15);
  }

  /* ── FILTERS ── */
  .filters { display: flex; align-items: center; gap: 18px; }
  .score-filter { display: flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.7); }
  .score-filter input[type=range] { width: 170px; accent-color: #F0B429; }
  #min-score-val { min-width: 34px; color: #fff; font-weight: 700; }
  .ramp { display: flex; align-items: center; gap: 8px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.45); }
  .ramp-bar { width: 110px; height: 8px; border-radius: 4px; background: linear-gradient(90deg,#2E86D4 0%,#7FA8C9 50%,#E8952A 90%,#F0B429 100%); }
  .filter-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 13px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.6);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { border-color: rgba(255,255,255,0.5); color: var(--white); }
  .filter-btn.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.5); color: var(--white); }
  .filter-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .count-badge {
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 1px 7px;
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
  }
  .filter-btn.active .count-badge { color: rgba(255,255,255,0.8); }

  /* ── MAP ── */
  #map { flex: 1; }

  /* ── POPUP ── */
  .leaflet-popup-content-wrapper {
    background: var(--navy);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    padding: 0;
  }
  .leaflet-popup-tip { background: var(--navy); }
  .leaflet-popup-content { margin: 0; width: 240px !important; }
  .popup-inner { padding: 16px 18px; }
  .popup-tier {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }
  .popup-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--white);
    line-height: 1.2;
    margin-bottom: 2px;
  }
  .popup-country {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    margin-bottom: 12px;
  }
  .popup-divider {
    border: none;
    border-top: 1px solid rgba(255,255,255,0.08);
    margin: 10px 0;
  }
  .popup-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .popup-stat-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 3px;
  }
  .popup-stat-value {
    font-size: 17px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .popup-stat-unit {
    font-size: 10px;
    color: rgba(255,255,255,0.35);
    margin-top: 2px;
    font-weight: 300;
  }
  .popup-cta {
    display: block;
    background: var(--gold);
    color: var(--navy);
    text-align: center;
    padding: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 0 0 5px 5px;
    transition: background 0.15s;
  }
  .popup-cta:hover { background: var(--gold-dark); }

  /* ── STATS BAR ── */
  .stats-bar {
    position: absolute;
    bottom: 24px;
    left: 24px;
    z-index: 900;
    background: var(--navy);
    border: 1px solid rgba(255,255,255,0.1);
    border-top: 2px solid var(--gold);
    border-radius: 6px;
    display: flex;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .stats-item {
    padding: 12px 18px;
    border-right: 1px solid rgba(255,255,255,0.08);
    min-width: 90px;
  }
  .stats-item:last-child { border-right: none; }
  .stats-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 4px;
  }
  .stats-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--white);
    line-height: 1;
  }
  .stats-value.gold { color: var(--gold); }

  /* Leaflet overrides */
  .leaflet-control-zoom {
    border: 1px solid rgba(255,255,255,0.1) !important;
    border-radius: 4px !important;
    overflow: hidden;
  }
  .leaflet-control-zoom a {
    background: var(--navy) !important;
    color: rgba(255,255,255,0.6) !important;
    border: none !important;
    border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    font-size: 16px !important;
    line-height: 28px !important;
    width: 28px !important;
    height: 28px !important;
  }
  .leaflet-control-zoom a:hover { color: var(--white) !important; background: var(--navy-mid) !important; }
  .leaflet-control-attribution {
    background: rgba(10,37,64,0.55) !important;
    color: rgba(255,255,255,0.45) !important;
    font-size: 10px !important;
    padding: 1px 6px !important;
  }
  .leaflet-control-attribution a { color: rgba(255,255,255,0.55) !important; }
</style>
</head>
<body>
<div class="page">

  <header class="header">
    <div class="header-left">
      <a href="/" class="brand">Narrows<span>.</span></a>
      <span class="header-title">Port Risk Index &mdash; <span id="n-ports">3,774</span> ports globally</span>
    </div>
    <div class="filters" id="filters">
      <label class="score-filter" for="min-score">
        Show ports scoring at least
        <input type="range" id="min-score" min="0.5" max="3.5" step="0.05" value="0.5">
        <span id="min-score-val">0.50</span>
      </label>
      <span class="ramp" title="Colour = percentile of PRI score (0 = lowest, 100 = highest)"><span class="ramp-lo">lower</span><span class="ramp-bar"></span><span class="ramp-hi">higher</span></span>
    </div>
  </header>

  <div id="map"></div>

  <div class="stats-bar">
    <div class="stats-item">
      <div class="stats-label">Ports indexed</div>
      <div class="stats-value" id="n-ports2">3,774</div>
    </div>
    <div class="stats-item">
      <div class="stats-label">Top 1% start at score</div>
      <div class="stats-value gold" id="top1">—</div>
    </div>
    <div class="stats-item">
      <div class="stats-label">Countries</div>
      <div class="stats-value" id="country-count">—</div>
    </div>
    <div class="stats-item">
      <div class="stats-label">Visible</div>
      <div class="stats-value" id="visible-count">3,774</div>
    </div>
  </div>

</div>

<script>
// ── COLOUR: continuous by percentile of PRI score (no category labels) ──
const RAMP = [[0,[46,134,212]],[50,[127,168,201]],[90,[232,149,42]],[100,[240,180,41]]];
function rampColour(pc) {
  pc = Math.max(0, Math.min(100, pc || 0));
  for (let i = 1; i < RAMP.length; i++) {
    if (pc <= RAMP[i][0]) {
      const [p0, c0] = RAMP[i-1], [p1, c1] = RAMP[i];
      const t = (pc - p0) / (p1 - p0 || 1);
      return 'rgb(' + c0.map((v, k) => Math.round(v + (c1[k] - v) * t)).join(',') + ')';
    }
  }
  return '#F0B429';
}

// ── MAP INIT ──
const map = L.map('map', {
  center: [20, 10],
  zoom: 3,
  zoomControl: true,
  maxZoom: 14,
  minZoom: 2,
});

L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png?key=cb1_3gva_1_acebee3ffd0b448154c0f98a', {
  attribution: '&copy; <a href="http://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>, &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19,
}).addTo(map);

// Subtle label layer on top
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png?key=cb1_3gva_1_acebee3ffd0b448154c0f98a', {
  attribution: '',
  subdomains: 'abcd',
  maxZoom: 19,
  pane: 'shadowPane',
}).addTo(map);

// ── LOAD DATA ──
let allMarkers = [];
let minScore = 0;
let countrySet = new Set();

const markerLayer = L.layerGroup().addTo(map);

function formatDwell(v) {
  if (!v || v === 'null') return '—';
  const h = parseFloat(v);
  if (isNaN(h)) return '—';
  return h >= 24 ? (h/24).toFixed(1) + 'd' : Math.round(h) + 'h';
}

function formatDepth(v) {
  if (!v || v === 'null') return '—';
  const d = parseFloat(v);
  if (isNaN(d)) return '—';
  return d.toFixed(1) + ' m';
}

function buildPopup(p) {
  const colour = rampColour(p.pc);
  return `
    <div class="popup-inner">
      <div class="popup-tier" style="color:${colour}">Rank #${p.rk.toLocaleString()} &middot; riskier than ${Math.min(99, Math.floor(p.pc))}% of ports</div>
      <div class="popup-name">${p.n}</div>
      <div class="popup-country">${p.c}</div>
      <hr class="popup-divider">
      <div class="popup-stats">
        <div>
          <div class="popup-stat-label">PRI Score</div>
          <div class="popup-stat-value" style="color:${colour}">${p.s.toFixed(2)}</div>
          <div class="popup-stat-unit">composite index</div>
        </div>
        <div>
          <div class="popup-stat-label">Dwell Time</div>
          <div class="popup-stat-value">${formatDwell(p.d)}</div>
          <div class="popup-stat-unit">avg cargo wait</div>
        </div>
        <div>
          <div class="popup-stat-label">Controlling Depth</div>
          <div class="popup-stat-value">${formatDepth(p.dp)}</div>
          <div class="popup-stat-unit">channel depth</div>
        </div>
      </div>
    </div>
    <a class="popup-cta" href="/pri" target="_parent">Explore full index →</a>
  `;
}

function getRadius(pc, zoom) {
  const r = 3.5 + 3.5 * Math.pow((pc || 0) / 100, 3);
  return zoom > 6 ? r + (zoom - 6) * 0.8 : r;
}

fetch('/pri_ports.json')
  .then(r => r.json())
  .then(ports => {
    ports.forEach(p => {
      countrySet.add(p.c);
      const colour = rampColour(p.pc);
      const isCritical = p.pc >= 99;
      const marker = L.circleMarker([p.la, p.lo], {
        radius: getRadius(p.pc, map.getZoom()),
        fillColor: colour,
        fillOpacity: isCritical ? 0.95 : 0.75,
        color: isCritical ? colour : 'transparent',
        weight: isCritical ? 1.5 : 0,
        className: 'port-marker',
      });
      marker.bindPopup(buildPopup(p), { maxWidth: 240, className: 'narrows-popup' });
      marker._portData = p;
      allMarkers.push(marker);
      markerLayer.addLayer(marker);
    });

    document.getElementById('country-count').textContent = countrySet.size;
    const n = ports.length, fmt = n.toLocaleString();
    ['n-ports','n-ports2'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = fmt; });
    const sorted = ports.map(q => q.s).sort((x, y) => y - x);
    document.getElementById('top1').textContent = sorted[Math.max(0, Math.floor(n * 0.01) - 1)].toFixed(2);
    updateVisibleCount();
  });

// ── ZOOM: resize markers ──
map.on('zoomend', () => {
  const z = map.getZoom();
  allMarkers.forEach(m => {
    m.setRadius(getRadius(m._portData.pc, z));
  });
});

// ── FILTER: minimum PRI score ──
function updateVisibleCount() {
  let count = 0;
  allMarkers.forEach(m => { if (m._portData.s >= minScore) count++; });
  document.getElementById('visible-count').textContent = count.toLocaleString();
}

document.getElementById('min-score').addEventListener('input', e => {
  minScore = parseFloat(e.target.value);
  document.getElementById('min-score-val').textContent = minScore.toFixed(2);
  allMarkers.forEach(m => {
    const show = m._portData.s >= minScore;
    if (show && !markerLayer.hasLayer(m)) markerLayer.addLayer(m);
    if (!show && markerLayer.hasLayer(m)) markerLayer.removeLayer(m);
  });
  updateVisibleCount();
});
</script>
</body>
</html>
